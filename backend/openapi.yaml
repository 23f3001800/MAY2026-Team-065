openapi: 3.1.0
info:
  title: Municipal Complaint Management API
  version: 0.1.0
paths:
  /auth/register:
    post:
      summary: Register User
      operationId: register_user_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegister'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/login:
    post:
      summary: Login
      operationId: login_auth_login_post
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Body_login_auth_login_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /complaints/:
    get:
      summary: Get Complaints
      operationId: get_complaints_complaints__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ComplaintResponse'
                type: array
                title: Response Get Complaints Complaints  Get
      security:
      - OAuth2PasswordBearer: []
    post:
      summary: Create Complaint
      operationId: create_complaint_complaints__post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComplaintCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /admin/analytics:
    get:
      summary: Get City Analytics
      operationId: get_city_analytics_admin_analytics_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - OAuth2PasswordBearer: []
  /complaints/{complaintId}/assign:
    patch:
      summary: Assign Field Worker
      operationId: assign_field_worker_complaints__complaintId__assign_patch
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: complaintId
        in: path
        required: true
        schema:
          type: string
          title: Complaintid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComplaintAssign'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /workers/:
    post:
      summary: Create Field Worker
      operationId: create_field_worker_workers__post
      security:
      - OAuth2PasswordBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FieldWorkerCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldWorkerResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      summary: Get Field Workers
      operationId: get_field_workers_workers__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: skillSet
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Skillset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FieldWorkerResponse'
                title: Response Get Field Workers Workers  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /complaints/worker/tasks:
    get:
      summary: Get Worker Tasks
      operationId: get_worker_tasks_complaints_worker_tasks_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ComplaintResponse'
                type: array
                title: Response Get Worker Tasks Complaints Worker Tasks Get
      security:
      - OAuth2PasswordBearer: []
  /users/{userId}/reset-password:
    patch:
      summary: Reset User Password
      operationId: reset_user_password_users__userId__reset_password_patch
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          title: Userid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordReset'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /complaints/{complaintId}/image:
    post:
      summary: Upload Complaint Image
      operationId: upload_complaint_image_complaints__complaintId__image_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: complaintId
        in: path
        required: true
        schema:
          type: string
          title: Complaintid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_complaint_image_complaints__complaintId__image_post'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /workers/me/availability:
    patch:
      summary: Update Worker Availability
      operationId: update_worker_availability_workers_me_availability_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvailabilityUpdate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /admin/users/official:
    post:
      summary: Create System Official
      operationId: create_system_official_admin_users_official_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemOfficialCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /admin/users:
    get:
      summary: List Users
      operationId: list_users_admin_users_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: query
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Query
      - name: role
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Role
      - name: skip
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Skip
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/users/{user_id}:
    patch:
      summary: Update User
      operationId: update_user_admin_users__user_id__patch
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          title: User Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /complaints/nearby:
    get:
      summary: Get Nearby Complaints
      operationId: get_nearby_complaints_complaints_nearby_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: latitude
        in: query
        required: true
        schema:
          type: number
          description: Citizen's current latitude
          title: Latitude
        description: Citizen's current latitude
      - name: longitude
        in: query
        required: true
        schema:
          type: number
          description: Citizen's current longitude
          title: Longitude
        description: Citizen's current longitude
      - name: radius_km
        in: query
        required: false
        schema:
          type: number
          description: Search radius in kilometers
          default: 5.0
          title: Radius Km
        description: Search radius in kilometers
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ComplaintResponse'
                title: Response Get Nearby Complaints Complaints Nearby Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /complaints/{complaintId}:
    get:
      summary: Get Complaint By Id
      operationId: get_complaint_by_id_complaints__complaintId__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: complaintId
        in: path
        required: true
        schema:
          type: string
          title: Complaintid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /complaints/{complaintId}/feedback:
    post:
      summary: Submit Feedback
      operationId: submit_feedback_complaints__complaintId__feedback_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: complaintId
        in: path
        required: true
        schema:
          type: string
          title: Complaintid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /complaints/{complaintId}/status:
    patch:
      summary: Update Complaint Status
      operationId: update_complaint_status_complaints__complaintId__status_patch
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: complaintId
        in: path
        required: true
        schema:
          type: string
          title: Complaintid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /complaints/{complaintId}/category:
    patch:
      summary: Recategorize Complaint
      operationId: recategorize_complaint_complaints__complaintId__category_patch
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: complaintId
        in: path
        required: true
        schema:
          type: string
          title: Complaintid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComplaintRecategorize'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /notifications/me:
    get:
      tags:
      - Notifications
      summary: List my notifications
      description: Return the current user's notifications, newest first.
      operationId: list_my_notifications_notifications_me_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: unreadOnly
        in: query
        required: false
        schema:
          type: boolean
          description: Return only unread notifications
          default: false
          title: Unreadonly
        description: Return only unread notifications
      - name: type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by notification type
          title: Type
        description: Filter by notification type
      - name: skip
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Skip
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationResponse'
                title: Response List My Notifications Notifications Me Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /notifications/me/unread-count:
    get:
      tags:
      - Notifications
      summary: Count my unread notifications
      description: Cheap badge count for the navigation bar.
      operationId: get_unread_count_notifications_me_unread_count_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCountResponse'
      security:
      - OAuth2PasswordBearer: []
  /notifications/{notificationId}/read:
    patch:
      tags:
      - Notifications
      summary: Mark a notification read or unread
      description: Persist read state for one notification the caller owns.
      operationId: mark_notification_read_notifications__notificationId__read_patch
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: notificationId
        in: path
        required: true
        schema:
          type: string
          title: Notificationid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationReadUpdate'
              default:
                isRead: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /notifications/me/read-all:
    post:
      tags:
      - Notifications
      summary: Mark all my notifications read
      operationId: mark_all_notifications_read_notifications_me_read_all_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkAllReadResponse'
      security:
      - OAuth2PasswordBearer: []
  /notifications/{notificationId}:
    delete:
      tags:
      - Notifications
      summary: Delete a notification
      description: Remove a notification from the caller's own inbox.
      operationId: delete_notification_notifications__notificationId__delete
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: notificationId
        in: path
        required: true
        schema:
          type: string
          title: Notificationid
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /ai/health:
    get:
      tags:
      - AI
      summary: AI subsystem status
      description: 'Report which AI features this deployment can actually serve.


        Unauthenticated on purpose: it exposes no data, and the frontend needs it

        before login to decide whether to show AI affordances at all.'
      operationId: ai_health_ai_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /ai/categorize:
    post:
      tags:
      - AI
      summary: Suggest a category for complaint text
      operationId: categorize_ai_categorize_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategorizeRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategorizeResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /ai/severity:
    post:
      tags:
      - AI
      summary: Predict complaint severity
      operationId: predict_severity_ai_severity_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeverityRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeverityResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /ai/duplicates:
    post:
      tags:
      - AI
      summary: Check for duplicate complaints
      operationId: check_duplicates_ai_duplicates_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DuplicateCheckRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuplicateCheckResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /ai/triage:
    post:
      tags:
      - AI
      summary: 'Full triage: category, severity, duplicates and summary'
      description: One call for the report form -- what the citizen sees before submitting.
      operationId: triage_ai_triage_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriageRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /ai/analyze-image:
    post:
      tags:
      - AI
      summary: Analyse a complaint photo (category, description, severity)
      description: 'Infer what a photo shows, how bad it is, and which department owns it.


        Returns 200 with ``available: false`` when analysis cannot run, so the

        citizen can still file the complaint. Only a genuinely malformed upload is

        a 4xx.'
      operationId: analyze_image_ai_analyze_image_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_analyze_image_ai_analyze_image_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /ai/describe:
    post:
      tags:
      - AI
      summary: Rewrite a complaint description for officers
      operationId: write_description_ai_describe_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DescriptionWriteupRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DescriptionWriteupResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /ai/assistant/query:
    post:
      tags:
      - AI
      summary: Ask the role-aware AI assistant
      description: Answer a question using only records the caller is authorised to read.
      operationId: assistant_query_ai_assistant_query_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistantQueryRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantQueryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /ai/complaints/{complaintId}/analyze:
    post:
      tags:
      - AI
      summary: Re-run AI triage on an existing complaint
      description: 'Re-triage a complaint and persist the result.


        Officers and administrators only: it writes to the complaint and can raise

        its severity, which is a triage decision rather than a read.'
      operationId: analyze_existing_complaint_ai_complaints__complaintId__analyze_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: complaintId
        in: path
        required: true
        schema:
          type: string
          title: Complaintid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AssistantQueryRequest:
      properties:
        question:
          type: string
          maxLength: 1000
          minLength: 3
          title: Question
      type: object
      required:
      - question
      title: AssistantQueryRequest
    AssistantQueryResponse:
      properties:
        answer:
          type: string
          title: Answer
        citations:
          items:
            type: string
          type: array
          title: Citations
          default: []
        source:
          type: string
          title: Source
        contextUsed:
          items:
            type: string
          type: array
          title: Contextused
          default: []
      type: object
      required:
      - answer
      - source
      title: AssistantQueryResponse
    AvailabilityUpdate:
      properties:
        status:
          type: string
          pattern: ^(AVAILABLE|UNAVAILABLE)$
          title: Status
          description: Must be AVAILABLE or UNAVAILABLE
      type: object
      required:
      - status
      title: AvailabilityUpdate
    Body_analyze_image_ai_analyze_image_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
          description: Photo of the civic issue
        description:
          type: string
          title: Description
          description: Optional citizen text to give the model context
          default: ''
      type: object
      required:
      - file
      title: Body_analyze_image_ai_analyze_image_post
    Body_login_auth_login_post:
      properties:
        grant_type:
          anyOf:
          - type: string
            pattern: ^password$
          - type: 'null'
          title: Grant Type
        username:
          type: string
          title: Username
        password:
