# Render blueprint. New → Blueprint → point at this repo, branch `deploy`.
#
# Defaults to the FREE plan so it works without a card. Two consequences, both
# real and neither obvious from the dashboard:
#
#   1. Free instances have NO persistent disk. Complaint photos are written to
#      the container filesystem and are gone on every deploy and every restart.
#      Everything else -- accounts, complaints, history -- lives in Postgres and
#      survives fine. To keep photos, switch `plan` to `starter` and uncomment
#      the `disk:` block at the bottom.
#
#   2. Free instances sleep after 15 minutes of no traffic. The next request
#      pays a cold start of roughly a minute, so the first person to open the
#      app after a quiet spell will think it is broken. Warn the team, or keep
#      it awake with a cron that pings /health.
services:
  - type: web
    name: smartcivic-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore          # nearest to the Supabase project; move both together
    branch: deploy

    # /health is the liveness probe: it touches nothing, so a database blip does
    # not make Render restart a process that is running perfectly well.
    # /health/ready is the one that checks Postgres -- deliberately not this.
    healthCheckPath: /health

    envVars:
      # Generated by Render and never shown to anyone. Rotating it signs every
      # user out, which is the correct behaviour and worth knowing before you do
      # it by accident.
      - key: SECRET_KEY
        generateValue: true

      # Set these in the dashboard -- `sync: false` means "prompt me, do not
      # store it in the repository".
      #
      # DATABASE_URL is the Supabase SESSION POOLER string with the driver
      # changed to postgresql+asyncpg://  (see DEPLOY.md -- the direct host is
      # IPv6-only and Render cannot reach it).
      - key: DATABASE_URL
        sync: false

      # Your Cloudflare Pages origin, e.g. https://smartcivic.pages.dev
      # No trailing slash, and never "*".
      - key: ALLOWED_ORIGINS
        sync: false

      - key: UPLOAD_DIR
        value: /data/uploads

      # One instance, so the in-process SLA sweeper is safe to leave running.
      # Set to false and drive POST /admin/sla/sweep from a cron if you scale up,
      # or several instances will race on the same complaints.
      - key: SLA_ENABLED
        value: "true"

      # Optional. Without them the deterministic rules engine still triages
      # every complaint, and email is written to the log instead of sent.
      # - key: GEMINI_API_KEY
      #   sync: false
      # - key: OPENROUTER_API_KEY
      #   sync: false

    # Requires a paid instance type. Uncomment together with plan: starter.
    # disk:
    #   name: uploads
    #   mountPath: /data
    #   sizeGB: 1
